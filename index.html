<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10121a">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ウマ娘 ズームクイズ</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <h1 class="logo">ウマ娘 <span>ズームクイズ</span></h1>
  <button id="btn-settings" class="icon-btn" type="button" title="設定">⚙</button>
</header>

<!-- ===== タイトル / 設定 ===== -->
<section id="screen-title" class="screen">
  <p class="lead">拡大された一部分だけを見て、どのウマ娘かを当てるクイズです。</p>

  <div class="settings">
    <div class="field">
      <label>難易度</label>
      <div class="segmented" id="set-difficulty">
        <button type="button" data-value="easy">やさしい</button>
        <button type="button" data-value="normal" class="on">ふつう</button>
        <button type="button" data-value="hard">むずかしい</button>
        <button type="button" data-value="extreme">鬼</button>
      </div>
      <p class="hint" id="difficulty-desc"></p>
    </div>

    <div class="field">
      <label>出題範囲</label>
      <div class="segmented" id="set-pool">
        <button type="button" data-value="uma" class="on">ウマ娘のみ</button>
        <button type="button" data-value="all">全キャラクター</button>
      </div>
      <p class="hint" id="pool-desc"></p>
    </div>

    <div class="field">
      <label>問題数</label>
      <div class="segmented" id="set-count">
        <button type="button" data-value="5">5問</button>
        <button type="button" data-value="10" class="on">10問</button>
        <button type="button" data-value="20">20問</button>
        <button type="button" data-value="0">エンドレス</button>
      </div>
    </div>

    <div class="field">
      <label>オプション</label>
      <label class="check"><input type="checkbox" id="set-autozoom"> じわじわ自動ズームアウト（10秒ごと・減点あり）</label>
    </div>
  </div>

  <button id="btn-start" class="primary" type="button">スタート</button>
  <p class="credit">画像は<a href="https://umamusume.jp/character/" target="_blank" rel="noopener">ウマ娘 プリティーダービー 公式ポータルサイト</a>のものを参照しています。 &copy; Cygames, Inc.</p>
</section>

<!-- ===== ゲーム ===== -->
<section id="screen-game" class="screen hidden">
  <div class="hud">
    <div class="hud-item"><span class="hud-label">問題</span><strong id="hud-progress">1 / 10</strong></div>
    <div class="hud-item"><span class="hud-label">スコア</span><strong id="hud-score">0</strong></div>
    <div class="hud-item"><span class="hud-label">連続正解</span><strong id="hud-streak">0</strong></div>
  </div>

  <div class="stage-wrap">
    <div id="stage" class="stage">
      <div id="stage-loading" class="stage-loading">読み込み中…</div>
      <div id="crop-marker" class="crop-marker hidden"></div>
    </div>
    <div class="zoom-meter"><span id="zoom-label">×0</span></div>
  </div>

  <div id="hint-box" class="hint-box hidden"></div>

  <div id="answer-area" class="answer-area">
    <div class="combo">
      <input id="answer-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="キャラ名を入力（ひらがな・カタカナ・英語）">
      <ul id="suggest" class="suggest hidden"></ul>
    </div>
    <div class="actions">
      <button id="btn-zoomout" class="ghost" type="button">ズームアウト <small>-25</small></button>
      <button id="btn-hint" class="ghost" type="button">ヒント <small>-20</small></button>
      <button id="btn-pass" class="ghost danger" type="button">パス</button>
    </div>
    <p id="input-msg" class="input-msg"></p>
  </div>

  <div id="result-area" class="result-area hidden">
    <div id="verdict" class="verdict"></div>
    <div class="answer-card">
      <div class="answer-name">
        <strong id="answer-ja"></strong>
        <span id="answer-en"></span>
        <span id="answer-meta"></span>
      </div>
      <div class="answer-costume" id="answer-costume"></div>
    </div>
    <button id="btn-next" class="primary" type="button">次へ</button>
  </div>
</section>

<!-- ===== リザルト ===== -->
<section id="screen-result" class="screen hidden">
  <h2 class="result-title">結果</h2>
  <div class="score-big"><span id="final-score">0</span><small>点</small></div>
  <p class="result-sub" id="final-sub"></p>

  <div id="share-grid" class="share-grid">
    <div id="share-squares"></div>
    <p class="share-legend">🟩 ノーヒント正解 ／ 🟨 ヒント・ズーム使用 ／ 🟥 不正解 ／ ⬜ パス</p>
  </div>
  <div class="share-actions">
    <button id="btn-share-x" class="ghost x-btn" type="button">𝕏 でポスト</button>
    <button id="btn-share-native" class="ghost hidden" type="button">共有</button>
    <button id="btn-copy" class="ghost" type="button">結果をコピー</button>
  </div>

  <div id="miss-list" class="miss-list"></div>
  <div class="actions center">
    <button id="btn-retry" class="primary" type="button">もう一度</button>
    <button id="btn-home" class="ghost" type="button">設定に戻る</button>
  </div>
</section>

<div id="toast" class="toast"></div>

<script src="data/characters.js"></script>
<script src="game.js"></script>
</body>
</html>
